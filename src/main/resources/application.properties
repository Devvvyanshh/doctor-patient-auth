spring.application.name=doctor-patient-jwt
server.port=8080

app.jwt.secret=${APP_JWT_SECRET}
app.jwt.expiration-ms=3600000
app.cors.allowed-origins=http://127.0.0.1:5173,http://localhost:5173

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/doctor_patient_jwt?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
